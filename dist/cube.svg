<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
      50% { transform: translateY(-5px) rotateX(10deg) rotateY(10deg); }
    }
    @keyframes innerPulse {
      0%, 100% { fill-opacity: 0.6; }
      50% { fill-opacity: 0.9; }
    }
  </style>
  <g style="animation: float 3s ease-in-out infinite; transform-origin: center;">
    <!-- Outer Cube - Changed stroke to black for visibility on light tabs -->
    <path d="M50 20 L80 35 L80 70 L50 85 L20 70 L20 35 Z" fill="none" stroke="#000000" stroke-width="4" />
    <path d="M50 20 L50 50 L80 35" fill="none" stroke="#000000" stroke-width="4" />
    <path d="M50 50 L20 35" fill="none" stroke="#000000" stroke-width="4" />
    <path d="M50 50 L50 85" fill="none" stroke="#000000" stroke-width="4" />
    
    <!-- Inner Cube (Gradient/Filled) - Changed to black fill -->
    <path d="M50 35 L70 45 L70 65 L50 75 L30 65 L30 45 Z" fill="#000000" style="animation: innerPulse 3s ease-in-out infinite;">
      <animate attributeName="fill" values="#000000;#333333;#000000" dur="3s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
